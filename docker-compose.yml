services: # es la lista de contenedores
  tasks-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${TASKS_DB_USER}
      POSTGRES_PASSWORD: ${TASKS_DB_PASSWORD}
      POSTGRES_DB: ${TASKS_DB_NAME}
    volumes:
      # conecta el volumen llamado 'tasks-db-data' a la carpeta '/var/lib/postgresql/data'
      # del contenedor
      - tasks-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"] # ¿PostgreSQL acepta conexiones?
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:5434:5432" # DBeaver → localhost:5434 → tasks-db:5432

  tasks-service:
    build: ./services/tasks-service
    ports:
      - "3002:3002"
    environment:
      TASKS_DB_HOST: tasks-db
      TASKS_DB_USER: ${TASKS_DB_USER}
      TASKS_DB_PASSWORD: ${TASKS_DB_PASSWORD}
      TASKS_DB_NAME: ${TASKS_DB_NAME}
      JWT_SECRET: ${JWT_SECRET} # el mismo valor de .env que usa auth-service
      AUTH_SERVICE_URL: http://auth-service:3001 # dirección de auth-service en la red de Compose
    depends_on:
      tasks-db:
        condition: service_healthy # espera a que tasks-db pase su healthcheck

  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - auth-db-data:/var/lib/postgresql/data # volumen propio, separado de tasks-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"] # ¿PostgreSQL acepta conexiones?
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:5433:5432" # DBeaver → localhost:5433 → auth-db:5432

  auth-service:
    build: ./services/auth-service
    ports:
      - "3001:3001"
    environment:
      AUTH_DB_HOST: auth-db # el nombre del servicio funciona como dirección
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"] # se llama a sí mismo
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      auth-db:
        condition: service_healthy # espera a que auth-db pase su healthcheck

  web:
    build: ./apps/web # usa apps/web/Dockerfile y apps/web/.dockerignore
    ports:
      - "3000:3000" # Chrome → localhost:3000 → web:3000
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001 # dentro de la red: nombre del servicio, no localhost
      TASKS_SERVICE_URL: http://tasks-service:3002
    depends_on:
      auth-service:
        condition: service_healthy # espera a que auth-service responda /health
      tasks-service:
        condition: service_started # no tiene healthcheck: basta con que haya arrancado

# declara que el volumen existe
volumes:
  tasks-db-data:
  auth-db-data:
