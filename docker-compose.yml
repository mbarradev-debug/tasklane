services: # es la lista de contenedores
  tasks-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${TASKS_DB_USER}
      POSTGRES_PASSWORD: ${TASKS_DB_PASSWORD}
      POSTGRES_DB: ${TASKS_DB_NAME}
    volumes:
      # conecta el volumen llamado 'tasks-db-data' a la carpeta '/var/lib/postgresql/data'
      # del contenedor
      - tasks-db-data:/var/lib/postgresql/data

  tasks-service:
    build: ./services/tasks-service
    ports:
      - "3002:3002"
    environment:
      TASKS_DB_HOST: tasks-db
      TASKS_DB_USER: ${TASKS_DB_USER}
      TASKS_DB_PASSWORD: ${TASKS_DB_PASSWORD}
      TASKS_DB_NAME: ${TASKS_DB_NAME}
    depends_on:
      - tasks-db

  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - auth-db-data:/var/lib/postgresql/data # volumen propio, separado de tasks-db

  auth-service:
    build: ./services/auth-service
    ports:
      - "3001:3001"
    environment:
      AUTH_DB_HOST: auth-db # el nombre del servicio funciona como dirección
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
    depends_on:
      - auth-db

# declara que el volumen existe
volumes:
  tasks-db-data:
  auth-db-data:
